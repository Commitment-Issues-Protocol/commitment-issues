name: Build branch

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Write package.json for the build branch
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const branchPkg = {
              name: pkg.name,
              version: pkg.version,
              license: pkg.license,
              type: pkg.type,
              main: 'index.js',
              bin: Object.fromEntries(Object.keys(pkg.bin).map((k) => [k, './index.js'])),
              dependencies: pkg.dependencies,
            };
            fs.writeFileSync('dist/package.json', JSON.stringify(branchPkg, null, 2) + '\n');
          "

      - name: Publish dist to build branch
        working-directory: ./dist
        run: |
          git init -q
          git checkout -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build:build
